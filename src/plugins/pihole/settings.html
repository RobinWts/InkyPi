<div class="form-group"
    style="padding: 16px; background: rgba(33, 150, 243, 0.1); border: 1px solid rgba(33, 150, 243, 0.3); border-radius: 8px; margin-bottom: 20px;">
    <div style="display: flex; align-items: flex-start; gap: 12px;">
        <span style="font-size: 20px;">ℹ️</span>
        <div style="flex: 1;">
            <p style="margin: 0 0 8px 0; font-weight: bold; color: var(--text-primary, #333); font-size: 14px;">
                API Token Required
            </p>
            <p style="margin: 0; color: var(--text-secondary, #666); font-size: 13px; line-height: 1.5;">
                This plugin requires a Pi-hole API token from your Pi-hole server. Set it via the <strong>API
                    Keys</strong> page in the web UI or add <code>PIHOLE_API_TOKEN=your_token_here</code> to your
                <code>.env</code> file manually.
            </p>
        </div>
    </div>
</div>

<div class="form-group">
    <div class="form-group nowrap">
        <label for="piholeUrl" class="form-label">Pi-hole URL:</label>
        <input type="text" id="piholeUrl" name="piholeUrl" placeholder="http://192.168.1.100" required
            class="form-input">
    </div>
</div>

<script>
    // Populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            // Populate text inputs
            document.getElementById('piholeUrl').value = pluginSettings.piholeUrl || '';
        }
    });
</script>
